plugins {
    id "com.android.application"
}

android {
    namespace "io.github.hipsterbwp.tvhome"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.hipsterbwp.tvhome"
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }

    // Release builds are signed with the private key the workflow decrypts; see build.yml.
    signingConfigs {
        release {
            storeFile System.getenv("SIGNING_KEYSTORE") ? file(System.getenv("SIGNING_KEYSTORE")) : null
            storePassword System.getenv("SIGNING_PASSWORD")
            keyAlias "tvhome"
            keyPassword System.getenv("SIGNING_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
